# File: frontend/nginx-frontend.conf
# Static-file server for the React SPA. The reverse proxy in front of this
# container handles TLS termination and forwards /api requests to the backend.

server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets generated by Vite
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static assets
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path returns index.html (React Router takes over).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Healthcheck endpoint used by the container HEALTHCHECK directive.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Standard hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable server tokens
    server_tokens off;
}
