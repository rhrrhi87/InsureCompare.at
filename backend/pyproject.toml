[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurecompare-backend"
version = "1.0.0"
description = "FastAPI backend for InsureCompare.at - AI-powered Austrian insurance comparison platform"
requires-python = ">=3.11"
authors = [{ name = "Amr" }]
license = { text = "Academic" }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "N", "SIM", "RET"]
# FastAPI intentionally declares Depends/Query/File calls in parameter defaults.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict_optional = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
